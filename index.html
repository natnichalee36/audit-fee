document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

10.5px}\n    .toggle .sw{width:26px;height:16px;flex:0 0 auto}\n    .toggle .sw::after{width:12px;height:12px}\n    .toggle[aria-pressed=\"true\"] .sw::after{transform:translateX(10px)}\n    .unit{font-size:12px}\n    thead th{padding:10px 10px;font-size:12.5px}\n    thead th .small{font-size:10.5px}\n    tbody td{padding:9px 10px;font-size:12.5px}\n    .range{font-size:12.5px;grid-template-columns:auto 8px auto;gap:3px;justify-content:start;font-weight:500}\n    .range.single{font-size:12.5px}\n    .range.single .note{font-size:11px}\n    .price{font-size:12.5px}\n    .price.inquire-cell{font-size:11.5px;white-space:normal}\n    .section-head h2{font-size:14px}\n    .doc-list li{font-size:12.5px;gap:10px}\n    .doc-list li .dsc{font-size:11.5px}\n    .group-title{font-size:11.5px}\n    .flow{gap:10px}\n    .flow .step{padding:10px 12px 12px;grid-template-columns:28px 1fr;gap:9px}\n    .flow .step .badge{width:26px;height:26px;font-size:12px}\n    .flow .step::before{left:23px;top:36px}\n    .flow .step .ttl{font-size:12.5px;margin:2px 0 2px}\n    .flow .step .desc{font-size:11.5px;line-height:1.55}\n    .flow .step .note{font-size:11px;padding:6px 10px;margin-top:8px}\n    .disclaimer{font-size:11px}\n    .summary{font-size:11.5px}\n    .summary .tag{font-size:11px;padding:2px 7px}\n  }\n\n  .section-head{\n    display:flex;align-items:baseline;justify-content:space-between;gap:12px;\n    margin:0 0 14px;flex-wrap:wrap;\n  }\n  .section-head h2{margin:0;font-size:16px;font-weight:600;color:var(--ink);letter-spacing:-.01em}\n  .section-head .hint{font-size:12.5px;color:var(--ink-soft)}\n\n  .doc-list{list-style:none;padding:0;margin:0;display:grid;gap:7px}\n  .doc-list li{\n    display:grid;grid-template-columns:8px 1fr;gap:12px;align-items:baseline;\n    font-size:14px;color:var(--ink);line-height:1.55;\n  }\n  .doc-list li::before{\n    content:\"\";width:5px;height:5px;border-radius:50%;\n    background:var(--brand);transform:translateY(2px);\n  }\n  .doc-list li .dsc{color:var(--ink-soft);font-size:12.5px;margin-left:6px}\n  .doc-group-block{margin-bottom:22px}\n  .doc-group-block:last-of-type{margin-bottom:0}\n  .group-title{\n    margin:0 0 10px;font-size:12.5px;font-weight:600;color:var(--ink-soft);\n    display:flex;align-items:center;gap:10px;letter-spacing:.04em;text-transform:uppercase;\n  }\n  .group-num{\n    display:inline-flex;align-items:center;justify-content:center;\n    min-width:30px;height:22px;padding:0 8px;border-radius:6px;\n    background:var(--brand);color:#fff;font-family:\"Sarabun\",sans-serif;font-weight:600;font-size:12px;\n    letter-spacing:0;\n  }\n  .doc-item{\n    background:#fff;border:1px solid var(--line);border-radius:12px;\n    padding:16px 18px;display:grid;grid-template-columns:36px 1fr;gap:12px;\n    transition:border-color .15s, box-shadow .15s;\n  }\n  .doc-item:hover{border-color:var(--brand);box-shadow:0 6px 18px -10px rgba(31,95,214,.35)}\n  .doc-item .ico{\n    width:36px;height:36px;border-radius:10px;background:#eef3fc;color:var(--brand-deep);\n    display:flex;align-items:center;justify-content:center;\n    font-family:\"Sarabun\", sans-serif;font-size:13px;font-weight:700;flex:0 0 auto;\n  }\n  .doc-item .body{display:flex;flex-direction:column;gap:3px;min-width:0}\n  .doc-item .ttl{font-size:14px;font-weight:600;color:var(--ink);line-height:1.35}\n  .doc-item .dsc{font-size:12.5px;color:var(--ink-soft);line-height:1.5}\n  .doc-item .tag{\n    display:inline-block;margin-top:4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;\n    color:#a05a14;font-weight:500;\n  }\n  .doc-item.opt .ico{background:#fdf3e6;color:#a05a14}\n\n  .flow{display:grid;gap:14px}\n  .flow .step{\n    background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);\n    padding:18px 22px 20px 22px;display:grid;grid-template-columns:48px 1fr;gap:18px;\n    position:relative;\n  }\n  .flow .step::before{\n    content:\"\";position:absolute;left:45px;top:64px;bottom:-14px;width:2px;\n    background:linear-gradient(to bottom, var(--line-strong), transparent);\n  }\n  .flow .step:last-child::before{display:none}\n  .flow .step .badge{\n    width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;\n    display:flex;align-items:center;justify-content:center;\n    font-family:\"Sarabun\", sans-serif;font-size:18px;font-weight:700;z-index:1;flex:0 0 auto;\n  }\n  .flow .step.done .badge{background:var(--accent)}\n  .flow .step .ttl{font-size:14.5px;font-weight:600;color:var(--brand-deep);margin:6px 0 6px}\n  .flow .step .desc{font-size:13.5px;color:var(--ink);line-height:1.6}\n  .flow .step .desc b{color:var(--brand-deep);font-weight:600;background:#eef3fc;padding:1px 6px;border-radius:4px}\n  .flow .step .note{\n    margin-top:10px;font-size:13px;color:var(--ink-soft);\n    background:#fafbfe;border:1px dashed var(--line-strong);border-radius:8px;padding:8px 12px;\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body data-screen-label=\"Audit fee table\" style=\"font-size: 14px\">\n  \n  <div class=\"page\">\n    <div class=\"wrap\">\n\n      <header class=\"page-header\">\n        <img class=\"brand-logo\" src=\"a83c9c90-5168-41a2-80cb-dc92945d6b64\" alt=\"Natnicha Auditing Service\">\n      <\u002Fheader>\n      <h1>ตารางค่าบริการสอบบัญชีเบื้องต้น<\u002Fh1>\n      <p class=\"sub\">ข้อมูลเบื้องต้นสำหรับลูกค้า ประกอบด้วย อัตราค่าบริการ รายการเอกสารที่ต้องเตรียม และเงื่อนไขการชำระเงิน<\u002Fp>\n\n      <div class=\"tabs\" role=\"tablist\" aria-label=\"หมวดข้อมูล\">\n        <button class=\"tab\" role=\"tab\" aria-selected=\"true\" data-tab=\"fees\">ค่าบริการ<\u002Fbutton>\n        <button class=\"tab\" role=\"tab\" aria-selected=\"false\" data-tab=\"docs\">เอกสาร<\u002Fbutton>\n        <button class=\"tab\" role=\"tab\" aria-selected=\"false\" data-tab=\"pay\">เงื่อนไข<\u002Fbutton>\n      <\u002Fdiv>\n\n      <section class=\"panel active\" id=\"fees-panel\" role=\"tabpanel\">\n      <div id=\"summary\" class=\"summary\"><\u002Fdiv>\n\n      <div class=\"card\" role=\"region\" aria-label=\"ตารางค่าบริการสอบบัญชี\">\n        <table>\n          <colgroup>\n            <col class=\"fee-col-1\" style=\"width:62%\">\n            <col class=\"fee-col-2\" style=\"width:38%\">\n          <\u002Fcolgroup>\n          <thead>\n            <tr>\n              <th scope=\"col\">\n                รายได้หรือค่าใช้จ่าย (แล้วแต่อันใดจะมากกว่า)\n                <span class=\"small\">/ ความซับซ้อน<\u002Fspan>\n              <\u002Fth>\n              <th scope=\"col\" class=\"num\">\n                ค่าบริการสอบบัญชี\n                <span class=\"small\">หน่วย : บาท<\u002Fspan>\n              <\u002Fth>\n            <\u002Ftr>\n          <\u002Fthead>\n          <tbody id=\"rows\">\n            <tr data-base=\"5000\" data-prep=\"1000\">\n              <td>\n                <span class=\"range single\">\n                  <span class=\"label\">งบการเงินเปล่า / ไม่ประกอบกิจการ<\u002Fspan>\n                  <span class=\"note\">มีแค่ค่าทำบัญชี, สอบบัญชี, ปรับปรุงดอกเบี้ยต่าง ๆ<\u002Fspan>\n                <\u002Fspan>\n              <\u002Ftd>\n              <td><div class=\"price\"><span class=\"value\">5,000<\u002Fspan><span class=\"breakdown\"><\u002Fspan><\u002Fdiv><\u002Ftd>\n            <\u002Ftr>\n            <tr data-base=\"7000\" data-prep=\"1000\">\n              <td><span class=\"range\"><span class=\"from\">1<\u002Fspan><span class=\"dash\">–<\u002Fspan><span class=\"to\">1,000,000<\u002Fspan><\u002Fspan><\u002Ftd>\n              <td><div class=\"price\"><span class=\"value\">7,000<\u002Fspan><span class=\"breakdown\"><\u002Fspan><\u002Fdiv><\u002Ftd>\n            <\u002Ftr>\n            <tr data-base=\"8000\" data-prep=\"1000\">\n              <td><span class=\"range\"><span class=\"from\">1,000,001<\u002Fspan><span class=\"dash\">–<\u002Fspan><span class=\"to\">3,000,000<\u002Fspan><\u002Fspan><\u002Ftd>\n              <td><div class=\"price\"><span class=\"value\">8,000<\u002Fspan><span class=\"breakdown\"><\u002Fspan><\u002Fdiv><\u002Ftd>\n            <\u002Ftr>\n            <tr data-base=\"9000\" data-prep=\"1000\">\n              <td><span class=\"range\"><span class=\"from\">3,000,001<\u002Fspan><span class=\"dash\">–<\u002Fspan><span class=\"to\">5,000,000<\u002Fspan><\u002Fspan><\u002Ftd>\n              <td><div class=\"price\"><span class=\"value\">9,000<\u002Fspan><span class=\"breakdown\"><\u002Fspan><\u002Fdiv><\u002Ftd>\n            <\u002Ftr>\n            <tr data-base=\"11000\" data-prep=\"1500\">\n              <td><span class=\"range\"><span class=\"from\">5,000,001<\u002Fspan><span class=\"dash\">–<\u002Fspan><span class=\"to\">7,000,000<\u002Fspan><\u002Fspan><\u002Ftd>\n              <td><div class=\"price\"><span class=\"value\">11,000<\u002Fspan><span class=\"breakdown\"><\u002Fspan><\u002Fdiv><\u002Ftd>\n            <\u002Ftr>\n            <tr data-base=\"12000\" data-prep=\"1500\">\n              <td><span class=\"range\"><span class=\"from\">7,000,001<\u002Fspan><span class=\"dash\">–<\u002Fspan><span class=\"to\">10,000,000<\u002Fspan><\u002Fspan><\u002Ftd>\n              <td><div class=\"price\"><span class=\"value\">12,000<\u002Fspan><span class=\"breakdown\"><\u002Fspan><\u002Fdiv><\u002Ftd>\n            <\u002Ftr>\n            <tr data-base=\"15000\" data-prep=\"2000\">\n              <td><span class=\"range\"><span class=\"from\">10,000,001<\u002Fspan><span class=\"dash\">–<\u002Fspan><span class=\"to\">15,000,000<\u002Fspan><\u002Fspan><\u002Ftd>\n              <td><div class=\"price\"><span class=\"value\">15,000<\u002Fspan><span class=\"breakdown\"><\u002Fspan><\u002Fdiv><\u002Ftd>\n            <\u002Ftr>\n            <tr data-base=\"19000\" data-prep=\"2000\">\n              <td><span class=\"range\"><span class=\"from\">15,000,001<\u002Fspan><span class=\"dash\">–<\u002Fspan><span class=\"to\">20,000,000<\u002Fspan><\u002Fspan><\u002Ftd>\n              <td><div class=\"price\"><span class=\"value\">19,000<\u002Fspan><span class=\"breakdown\"><\u002Fspan><\u002Fdiv><\u002Ftd>\n            <\u002Ftr>\n            <tr data-base=\"23000\" data-prep=\"2000\">\n              <td><span class=\"range\"><span class=\"from\">20,000,001<\u002Fspan><span class=\"dash\">–<\u002Fspan><span class=\"to\">25,000,000<\u002Fspan><\u002Fspan><\u002Ftd>\n              <td><div class=\"price\"><span class=\"value\">23,000<\u002Fspan><span class=\"breakdown\"><\u002Fspan><\u002Fdiv><\u002Ftd>\n            <\u002Ftr>\n            <tr data-base=\"27000\" data-prep=\"2000\">\n              <td><span class=\"range\"><span class=\"from\">25,000,001<\u002Fspan><span class=\"dash\">–<\u002Fspan><span class=\"to\">30,000,000<\u002Fspan><\u002Fspan><\u002Ftd>\n              <td><div class=\"price\"><span class=\"value\">27,000<\u002Fspan><span class=\"breakdown\"><\u002Fspan><\u002Fdiv><\u002Ftd>\n            <\u002Ftr>\n            <tr class=\"inquire\">\n              <td>\n                <span class=\"range single\">\n                  <span class=\"label\">มากกว่า 30,000,000<\u002Fspan>\n                  <span class=\"note\">อัตราขึ้นอยู่กับขอบเขตของงานและความซับซ้อนของกิจการ<\u002Fspan>\n                <\u002Fspan>\n              <\u002Ftd>\n              <td><div class=\"price inquire-cell\"><span class=\"value\">สอบถามเพิ่มเติม<\u002Fspan><\u002Fdiv><\u002Ftd>\n            <\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n\n        <div class=\"foot\">\n          <span><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"addons\" role=\"group\" aria-label=\"บริการเสริม\">\n        <div class=\"addons-head\">\n          <span class=\"addons-title\">บริการเสริม<\u002Fspan>\n          <span class=\"addons-hint\">เปิดเพื่อรวมราคากับตารางด้านบน<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"options\" role=\"group\">\n          <button id=\"prepToggle\" class=\"toggle\" type=\"button\" aria-pressed=\"false\">\n            <span class=\"sw\" aria-hidden=\"true\"><\u002Fspan>\n            <span>+ งบการเงิน (TH)<\u002Fspan>\n          <\u002Fbutton>\n          <button id=\"enToggle\" class=\"toggle\" type=\"button\" aria-pressed=\"false\">\n            <span class=\"sw\" aria-hidden=\"true\"><\u002Fspan>\n            <span>+ งบการเงิน (EN)<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <p class=\"disclaimer\">\n        * อัตราข้างต้นเป็นราคาเริ่มต้นสำหรับกิจการที่มีความซับซ้อนปกติ กรณีกิจการมีรายการพิเศษ เช่น สาขาหลายแห่ง สินค้าคงเหลือจำนวนมาก หรือธุรกรรมระหว่างประเทศ อาจมีการปรับราคาเพิ่มเติมตามขอบเขตของงานจริง\n      <\u002Fp>\n      <\u002Fsection>\n\n      <section class=\"panel\" id=\"docs-panel\" role=\"tabpanel\">\n        <div class=\"section-head\">\n          <h2>เอกสารเบื้องต้นที่ใช้ในการตรวจสอบ<\u002Fh2>\n        <\u002Fdiv>\n        <div class=\"doc-group-block\">\n          <h3 class=\"group-title\"><span class=\"group-num\">01<\u002Fspan>เอกสารบริษัท<\u002Fh3>\n          <ul class=\"doc-list\">\n            <li><span>งบการเงินปีก่อนหน้าที่ตรวจสอบโดยผู้สอบบัญชีคนก่อน<\u002Fspan><\u002Fli>\n            <li><span>หนังสือรับรองบริษัท <span class=\"dsc\">(ฉบับล่าสุด)<\u002Fspan><\u002Fspan><\u002Fli>\n            <li><span>บอจ.5 <span class=\"dsc\">(ฉบับล่าสุด)<\u002Fspan><\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n\n        <div class=\"doc-group-block\">\n          <h3 class=\"group-title\"><span class=\"group-num\">02<\u002Fspan>เอกสารบัญชีและการเงิน<\u002Fh3>\n          <ul class=\"doc-list\">\n            <li><span>งบทดลอง (TB) และบัญชีแยกประเภท (GL)<\u002Fspan><\u002Fli>\n            <li><span>Bank statement ทุกธนาคาร ตั้งแต่ต้นรอบบัญชี – สิ้นรอบบัญชี<\u002Fspan><\u002Fli>\n            <li><span>ทะเบียนสินทรัพย์และค่าเสื่อมราคา <span class=\"dsc\">(ถ้ามี)<\u002Fspan><\u002Fspan><\u002Fli>\n            <li><span>รายงานสินค้าคงเหลือ ณ วันสิ้นรอบ <span class=\"dsc\">(ถ้ามี)<\u002Fspan><\u002Fspan><\u002Fli>\n            <li><span>สัญญาเงินกู้ยืมธนาคาร / สัญญาเช่าซื้อ <span class=\"dsc\">(ถ้ามี)<\u002Fspan><\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n\n        <div class=\"doc-group-block\">\n          <h3 class=\"group-title\"><span class=\"group-num\">03<\u002Fspan>เอกสารภาษี<\u002Fh3>\n          <ul class=\"doc-list\">\n            <li><span>เอกสารการยื่นภาษีทุกเดือน (ภ.ง.ด.50/51, ภ.พ.30, ภ.ง.ด.3/53 และอื่น ๆ ที่เกี่ยวข้อง)<\u002Fspan><\u002Fli>\n            <li><span>รายละเอียดการคำนวณภาษีเงินได้นิติบุคคล สำหรับปีปัจจุบัน<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <p class=\"disclaimer\">\n          * รายการข้างต้นเป็นเอกสารเบื้องต้น อาจมีการขอเอกสารเพิ่มเติมตามลักษณะของธุรกิจและขอบเขตของงานสอบบัญชี\n        <\u002Fp>\n      <\u002Fsection>\n\n      <section class=\"panel\" id=\"pay-panel\" role=\"tabpanel\">\n        <div class=\"section-head\">\n          <h2>ขั้นตอนการส่งมอบงานและชำระเงิน<\u002Fh2>\n        <\u002Fdiv>\n        <div class=\"flow\">\n          <div class=\"step\"><div class=\"badge\">1<\u002Fdiv><div>\n            <div class=\"ttl\">ส่งร่างงบการเงินให้พิจารณาและยืนยันความถูกต้อง<\u002Fdiv>\n            <div class=\"desc\">จัดส่ง <b>ร่างงบการเงิน<\u002Fb> ให้ลูกค้าพิจารณาและยืนยันความถูกต้อง<\u002Fdiv>\n          <\u002Fdiv><\u002Fdiv>\n          <div class=\"step\"><div class=\"badge\">2<\u002Fdiv><div>\n            <div class=\"ttl\">ยืนยันงบ · ชำระเงิน<\u002Fdiv>\n            <div class=\"desc\">เมื่อลูกค้ายืนยันงบการเงินแล้ว <b>รบกวนชำระค่าบริการก่อน<\u002Fb> เพื่อดำเนินขั้นตอนถัดไป<\u002Fdiv>\n          <\u002Fdiv><\u002Fdiv>\n          <div class=\"step done\"><div class=\"badge\">3<\u002Fdiv><div>\n            <div class=\"ttl\">จัดส่งงบการเงินฉบับลงนาม<\u002Fdiv>\n            <div class=\"desc\">ส่ง <b>ฉบับสแกนทางอีเมล<\u002Fb> ก่อน จากนั้นจัดส่ง <b>ฉบับจริงทางไปรษณีย์<\u002Fb> ให้ภายหลัง<\u002Fdiv>\n          <\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<script>\n  document.querySelectorAll('.tab').forEach(tab => {\n    tab.addEventListener('click', () => {\n      const target = tab.dataset.tab;\n      document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t === tab)));\n      document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === target + '-panel'));\n    });\n  });\n\n  const prepBtn = document.getElementById('prepToggle');\n  const enBtn   = document.getElementById('enToggle');\n  const rows    = document.querySelectorAll('#rows tr');\n  const summary = document.getElementById('summary');\n  const fmt = n => n.toLocaleString('en-US');\n\n  function state(){\n    return {\n      prep: prepBtn.getAttribute('aria-pressed') === 'true',\n      en:   enBtn.getAttribute('aria-pressed')   === 'true',\n    };\n  }\n\n  function render(){\n    const s = state();\n\n    rows.forEach(tr => {\n      if(!tr.dataset.base) return;\n      const base = Number(tr.dataset.base);\n      const prep = Number(tr.dataset.prep);\n      const en   = 3000;\n\n      let total = base;\n      const parts = [];\n      if(s.prep){ total += prep; parts.push(`+${fmt(prep)} TH`); }\n      if(s.en)  { total += en;   parts.push(`+${fmt(en)} EN`); }\n\n      const priceEl = tr.querySelector('.price');\n      priceEl.querySelector('.value').textContent = fmt(total);\n      priceEl.querySelector('.breakdown').textContent = parts.length ? parts.join(' · ') : '';\n      priceEl.classList.toggle('active', parts.length > 0);\n    });\n\n    // Summary chips\n    summary.innerHTML = '';\n    const tags = [];\n    if(s.prep) tags.push('จัดทำงบการเงิน');\n    if(s.en)   tags.push('งบภาษาอังกฤษ');\n    if(tags.length){\n      summary.insertAdjacentHTML('beforeend', `<span>กำลังรวม:<\u002Fspan>` + tags.map(t => `<span class=\"tag\">${t}<\u002Fspan>`).join(''));\n    }\n  }\n\n  function bind(btn){\n    btn.addEventListener('click', () => {\n      const on = btn.getAttribute('aria-pressed') === 'true';\n      btn.setAttribute('aria-pressed', String(!on));\n      render();\n    });\n  }\n  bind(prepBtn);\n  bind(enBtn);\n  render();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
